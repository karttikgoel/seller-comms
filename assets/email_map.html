<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Email Map Dashboard</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- SheetJS for Excel parsing -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

    <style>
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }

        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        .panel-hidden { transform: translateX(100%); pointer-events: none; }
        .panel-visible { transform: translateX(0); pointer-events: auto; }
        .modal-hidden { display: none !important; opacity: 0; pointer-events: none; }
        .modal-visible { display: flex !important; opacity: 1; pointer-events: auto; }

        /* Smooth transitions for sections and cards */
        .collapsible-content {
            transition: max-height 0.4s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.3s ease;
            overflow: hidden;
            max-height: 5000px; 
            opacity: 1;
        }
        
        .collapsed {
            max-height: 0 !important;
            opacity: 0 !important;
            pointer-events: none;
        }

        /* Filter block collapse transitions */
        .filters-collapsed {
            max-height: 0px !important;
            opacity: 0 !important;
            pointer-events: none;
            padding-bottom: 0 !important;
        }

        @keyframes slideUp { to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body class="flex h-screen bg-slate-50 font-sans text-slate-900 overflow-hidden">

    <!-- LEFT SIDEBAR -->
    <aside class="w-64 bg-white border-r border-slate-200 flex flex-col shadow-sm z-10 shrink-0">
        <div class="p-5 bg-[#feee00] flex items-center gap-3 border-b border-yellow-400">
            <div class="bg-black p-1.5 rounded text-[#feee00]">
                <i data-lucide="mail" class="w-5 h-5"></i>
            </div>
            <h1 class="font-bold text-black tracking-tight text-lg">Email Map</h1>
        </div>

        <div class="p-4 border-b border-slate-100">
            <button onclick="openModal('importModal')" class="w-full flex items-center justify-center gap-2 bg-black text-white py-2.5 rounded-lg hover:bg-slate-800 transition-colors shadow-sm font-medium text-sm">
                <i data-lucide="upload" class="w-4 h-4"></i> Import Data
            </button>
            <button onclick="openModal('addModal')" class="w-full flex items-center justify-center gap-2 bg-slate-100 text-slate-700 py-2.5 rounded-lg hover:bg-slate-200 transition-colors shadow-sm font-medium text-sm mt-2">
                <i data-lucide="plus" class="w-4 h-4"></i> Add Template
            </button>
        </div>

        <nav class="flex-1 overflow-y-auto p-3 space-y-1">
            <div class="text-[11px] font-bold text-slate-400 uppercase tracking-wider mb-3 px-3 mt-2">Filter by Team</div>
            <div id="team-filters">
                <!-- Filters injected via JS -->
            </div>
        </nav>
    </aside>

    <!-- MAIN CONTENT AREA -->
    <main class="flex-1 flex flex-col h-full overflow-hidden relative">
        <!-- Header -->
        <header class="bg-white border-b border-slate-200 p-4 flex items-center justify-between gap-4 z-10 shrink-0">
            <div class="relative flex-1 max-w-2xl">
                <i data-lucide="search" class="absolute left-3 top-1/2 -translate-y-1/2 w-4 h-4 text-slate-400"></i>
                <input
                    type="text"
                    id="search-input"
                    placeholder="Search by Email Name, subject, trigger, or team..."
                    class="w-full pl-10 pr-4 py-2 bg-slate-100 border-transparent focus:bg-white focus:border-[#feee00] focus:ring-2 focus:ring-[#feee00]/50 rounded-lg text-sm transition-all outline-none"
                >
            </div>
            <div class="flex items-center gap-4">
                <div class="flex items-center gap-1 bg-slate-100 p-1 rounded-lg border border-slate-200">
                    <button onclick="setView('dashboard')" id="btn-view-dashboard" class="px-3 py-1.5 rounded text-xs font-bold transition-all text-slate-500 hover:text-slate-800 flex items-center gap-1.5"><i data-lucide="layout-dashboard" class="w-3.5 h-3.5"></i> Dashboard</button>
                    <button onclick="setView('journey')" id="btn-view-journey" class="px-3 py-1.5 rounded text-xs font-bold transition-all text-slate-500 hover:text-slate-800 flex items-center gap-1.5"><i data-lucide="map" class="w-3.5 h-3.5"></i> Journey</button>
                </div>
                <div id="template-count" class="text-sm text-slate-500 font-medium whitespace-nowrap hidden sm:block">
                    0 templates
                </div>
            </div>
        </header>

        <!-- Dynamic Content Container -->
        <div id="main-content-container" class="flex-1 overflow-hidden relative flex flex-col">
            <!-- Journey Map or Dashboard injected here via JS -->
        </div>
    </main>

    <!-- DETAIL SLIDE-OVER PANEL -->
    <aside id="detail-panel" class="absolute top-0 right-0 bottom-0 w-full sm:w-[600px] lg:w-[800px] bg-white border-l border-slate-200 shadow-2xl flex flex-col z-50 transition-transform duration-300 panel-hidden">
        <div class="p-4 border-b border-slate-200 flex items-center justify-between bg-white shrink-0">
            <h2 class="font-bold text-lg text-slate-800">Template Details</h2>
            <button onclick="closeDetailPanel()" class="p-1.5 hover:bg-slate-100 rounded-md text-slate-500 transition-colors">
                <i data-lucide="x" class="w-5 h-5"></i>
            </button>
        </div>
        <div id="detail-content" class="flex-1 overflow-y-auto flex flex-col">
            <!-- Details injected via JS -->
        </div>
    </aside>

    <!-- IMPORT MODAL -->
    <div id="importModal" class="fixed inset-0 z-50 items-center justify-center p-4 bg-slate-900/50 backdrop-blur-sm transition-opacity duration-200 modal-hidden">
        <div class="bg-white rounded-2xl w-full max-w-md overflow-hidden shadow-2xl">
            <div class="p-6 border-b border-slate-100 flex justify-between items-center">
                <h2 class="text-lg font-bold text-slate-900">Import Data</h2>
                <button onclick="closeModal('importModal')" class="text-slate-400 hover:text-slate-600">
                    <i data-lucide="x" class="w-5 h-5"></i>
                </button>
            </div>
            <div class="p-6">
                <p id="importErrorMsg" class="text-xs text-red-500 font-medium mb-4 p-3 bg-red-50 rounded-lg hidden"></p>
                <div class="mb-2">
                    <label class="block text-[11px] font-bold text-slate-400 uppercase tracking-wider mb-2">Upload Local File</label>
                    <div class="flex items-center justify-center w-full">
                        <label for="file-upload" class="flex flex-col items-center justify-center w-full h-48 border-2 border-slate-300 border-dashed rounded-lg cursor-pointer bg-slate-50 hover:bg-slate-100 transition-colors">
                            <div class="flex flex-col items-center justify-center pt-5 pb-6 text-slate-500">
                                <i data-lucide="upload-cloud" class="w-10 h-10 mb-3"></i>
                                <p class="text-sm font-semibold">Click to upload or drag & drop</p>
                                <p class="text-xs text-slate-400 mt-1">.XLSX, .XLS, or .CSV</p>
                            </div>
                            <input id="file-upload" type="file" class="hidden" accept=".xlsx, .xls, .csv" onchange="handleFileUpload(event)" />
                        </label>
                    </div>
                </div>
                <p class="text-[10px] text-slate-400 mt-4 italic">Note: Importing will replace existing templates. The file should contain headers matching: Email Name, Template Link, From, Owner Team, Lifecycle Stage, Send Method, etc.</p>
            </div>
        </div>
    </div>

    <!-- ADD TEMPLATE MODAL -->
    <div id="addModal" class="fixed inset-0 z-50 items-center justify-center p-4 bg-slate-900/50 backdrop-blur-sm transition-opacity duration-200 modal-hidden">
        <div class="bg-white rounded-2xl w-full max-w-2xl max-h-[90vh] flex flex-col shadow-2xl">
            <div class="p-6 border-b border-slate-100 flex justify-between items-center shrink-0">
                <h2 class="text-lg font-bold text-slate-900">Add New Template</h2>
                <button onclick="closeModal('addModal')" class="text-slate-400 hover:text-slate-600">
                    <i data-lucide="x" class="w-5 h-5"></i>
                </button>
            </div>
            <div class="p-6 overflow-y-auto flex-1">
                <form id="addTemplateForm" class="flex flex-col gap-5">
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
                        <div>
                            <label class="text-[11px] font-bold text-slate-400 uppercase tracking-wider block mb-1">Email Name *</label>
                            <input required name="emailName" type="text" placeholder="e.g. ID_Update_Reminder" class="w-full px-4 py-2 bg-slate-50 border border-slate-200 rounded-lg text-sm focus:bg-white focus:ring-2 focus:ring-[#feee00] focus:border-transparent outline-none transition-all">
                        </div>
                        <div>
                            <label class="text-[11px] font-bold text-slate-400 uppercase tracking-wider block mb-1">Subject (EN) *</label>
                            <input required name="subject" type="text" placeholder="e.g. Action Required: Update your ID" class="w-full px-4 py-2 bg-slate-50 border border-slate-200 rounded-lg text-sm focus:bg-white focus:ring-2 focus:ring-[#feee00] focus:border-transparent outline-none transition-all">
                        </div>
                        <div>
                            <label class="text-[11px] font-bold text-slate-400 uppercase tracking-wider block mb-1">Template Link (URL)</label>
                            <input name="templateLink" type="url" placeholder="https://..." class="w-full px-4 py-2 bg-slate-50 border border-slate-200 rounded-lg text-sm focus:bg-white focus:ring-2 focus:ring-[#feee00] focus:border-transparent outline-none transition-all">
                        </div>
                        <div>
                            <label class="text-[11px] font-bold text-slate-400 uppercase tracking-wider block mb-1">Sender Email (From)</label>
                            <input name="senderEmail" type="text" placeholder="e.g. support@noon.com" class="w-full px-4 py-2 bg-slate-50 border border-slate-200 rounded-lg text-sm focus:bg-white focus:ring-2 focus:ring-[#feee00] focus:border-transparent outline-none transition-all">
                        </div>
                        <div>
                            <label class="text-[11px] font-bold text-slate-400 uppercase tracking-wider block mb-1">Owner Team *</label>
                            <input required name="team" type="text" placeholder="e.g. Logistics, Finance" class="w-full px-4 py-2 bg-slate-50 border border-slate-200 rounded-lg text-sm focus:bg-white focus:ring-2 focus:ring-[#feee00] focus:border-transparent outline-none transition-all">
                        </div>
                        <div>
                            <label class="text-[11px] font-bold text-slate-400 uppercase tracking-wider block mb-1">Lifecycle Stage</label>
                            <input name="lifecycleStage" type="text" placeholder="e.g. Onboarding, Fulfilment" class="w-full px-4 py-2 bg-slate-50 border border-slate-200 rounded-lg text-sm focus:bg-white focus:ring-2 focus:ring-[#feee00] focus:border-transparent outline-none transition-all">
                        </div>
                        <div>
                            <label class="text-[11px] font-bold text-slate-400 uppercase tracking-wider block mb-1">Trigger Type</label>
                            <input name="triggerType" type="text" placeholder="e.g. Event Based, Cron Job" class="w-full px-4 py-2 bg-slate-50 border border-slate-200 rounded-lg text-sm focus:bg-white focus:ring-2 focus:ring-[#feee00] focus:border-transparent outline-none transition-all">
                        </div>
                        <div>
                            <label class="text-[11px] font-bold text-slate-400 uppercase tracking-wider block mb-1">Trigger Event Logic</label>
                            <input name="trigger" type="text" placeholder="e.g. order_shipped event" class="w-full px-4 py-2 bg-slate-50 border border-slate-200 rounded-lg text-sm focus:bg-white focus:ring-2 focus:ring-[#feee00] focus:border-transparent outline-none transition-all">
                        </div>
                        <div>
                            <label class="text-[11px] font-bold text-slate-400 uppercase tracking-wider block mb-1">Email Type</label>
                            <input name="emailType" type="text" placeholder="e.g. Transactional, Marketing" class="w-full px-4 py-2 bg-slate-50 border border-slate-200 rounded-lg text-sm focus:bg-white focus:ring-2 focus:ring-[#feee00] focus:border-transparent outline-none transition-all">
                        </div>
                        <div>
                            <label class="text-[11px] font-bold text-slate-400 uppercase tracking-wider block mb-1">Category</label>
                            <input name="category" type="text" placeholder="e.g. Seller Updates, Financials" class="w-full px-4 py-2 bg-slate-50 border border-slate-200 rounded-lg text-sm focus:bg-white focus:ring-2 focus:ring-[#feee00] focus:border-transparent outline-none transition-all">
                        </div>
                        <div class="col-span-full">
                            <label class="text-[11px] font-bold text-slate-400 uppercase tracking-wider block mb-1">Send Method</label>
                            <input name="sendMethod" type="text" placeholder="e.g. Automated, Manual" class="w-full px-4 py-2 bg-slate-50 border border-slate-200 rounded-lg text-sm focus:bg-white focus:ring-2 focus:ring-[#feee00] focus:border-transparent outline-none transition-all">
                        </div>
                    </div>
                    <div>
                        <label class="text-[11px] font-bold text-slate-400 uppercase tracking-wider block mb-1">Primary Purpose *</label>
                        <textarea required name="purpose" placeholder="Briefly describe what this email is meant to do..." class="w-full px-4 py-2 bg-slate-50 border border-slate-200 rounded-lg text-sm focus:bg-white focus:ring-2 focus:ring-[#feee00] focus:border-transparent outline-none transition-all resize-none" rows="2"></textarea>
                    </div>
                    <div>
                        <label class="text-[11px] font-bold text-slate-400 uppercase tracking-wider block mb-1">Template HTML (Optional)</label>
                        <textarea name="html" placeholder="Paste your raw HTML here..." class="w-full px-4 py-3 bg-[#1e1e1e] text-green-400 border border-slate-800 rounded-lg text-xs font-mono focus:ring-2 focus:ring-[#feee00] focus:border-transparent outline-none transition-all resize-y" rows="6"></textarea>
                    </div>
                    <div class="flex justify-end gap-3 mt-2 pt-5 border-t border-slate-100">
                        <button type="button" onclick="closeModal('addModal')" class="px-5 py-2.5 text-sm font-medium text-slate-600 hover:bg-slate-100 rounded-lg transition-colors">Cancel</button>
                        <button type="submit" class="px-5 py-2.5 text-sm font-medium bg-[#feee00] text-black hover:bg-yellow-400 rounded-lg transition-colors shadow-sm flex items-center gap-2">
                            <i data-lucide="plus" class="w-4 h-4"></i> Save Template
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <div id="fullscreenModal" class="fixed inset-0 z-[60] bg-slate-50 flex-col transition-opacity duration-200 modal-hidden"></div>

    <script>
        // --- INITIAL DATA ---
        const initialData = [
            {
                "S No": "1",
                "Email Name": "FUNDED_DEAL_ENROLMENT",
                "From": "promos@noon.com",
                "Target Sellers": "Enrolled Sellers",
                "Template Link": "https://example.com/template-1",
                "Lifecycle Stage": "Onboarding",
                "Owner Team": "Deals, Promos",
                "Email Subject (En)": "Some of your SKUs were enrolled into a noon funded deal",
                "System / Tool": "Promo Engine",
                "Trigger Type": "Event Based",
                "Trigger Event": "SKU enrollment trigger",
                "Primary Purpose": "Notify seller that their SKUs have been enrolled into a noon funded deal program.",
                "Template HTML": "<html><body><div style='padding:20px; font-family:sans-serif;'><h2>Deal Enrolled</h2><p>Your SKUs are now in a funded deal.</p></div></body></html>",
                "Email Type": "Notification",
                "Category": "Seller Updates",
                "Send Method": "Automated"
            },
            {
                "S No": "2",
                "Email Name": "WEEKLY_PAYOUT_STATEMENT",
                "From": "finance@noon.com",
                "Target Sellers": "All active sellers",
                "Template Link": "https://example.com/template-2",
                "Lifecycle Stage": "Account Management",
                "Owner Team": "Finance",
                "Email Subject (En)": "Your weekly noon statement is available",
                "System / Tool": "Finance Service",
                "Trigger Type": "Cron Job",
                "Trigger Event": "Statement Generation Completion",
                "Primary Purpose": "Notify sellers that their weekly payout statement has been generated.",
                "Template HTML": "<html><body><div style='padding:20px; font-family:sans-serif;'><h2>Statement Ready</h2><p>Your financial statement is ready for review.</p></div></body></html>",
                "Email Type": "Transactional",
                "Category": "Financials",
                "Send Method": "Automated"
            }
        ];

        // --- APP STATE ---
        let state = {
            data: [...initialData],
            searchQuery: '',
            selectedTeam: 'All',
            currentView: 'journey', // 'journey' or 'dashboard'
            selectedEmail: null,
            previewTab: 'visual',
            previewDevice: 'desktop',
            isFullscreen: false,
            expandedCards: {},
            expandedSections: {}, 
            filters: { trigger: null, system: null, sender: null, emailType: null, category: null, sendMethod: null }
        };

        const setView = (v) => { state.currentView = v; updateUI(); };
        const toggleFilter = (key, value) => { state.filters[key] = value; updateUI(); };
        const clearAllFilters = () => { Object.keys(state.filters).forEach(k => state.filters[k] = null); updateUI(); };

        const safeId = (str) => btoa(encodeURIComponent(str || 'none')).replace(/=/g, '');
        const esc = (str) => String(str == null ? '' : str).replace(/[&<>'"]/g, tag => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;'}[tag]));
        const escapeHTML = (str) => {
            if (!str) return '<!-- No HTML provided -->';
            return str.replace(/[&<>'"]/g, tag => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;'}[tag]));
        };

        const getTeamColor = (team) => {
            const colors = {'Deals, Promos': 'bg-pink-100 text-pink-700', 'Logistics': 'bg-blue-100 text-blue-700', 'Finance': 'bg-green-100 text-green-700', 'Seller Support': 'bg-purple-100 text-purple-700', 'Seller Risk': 'bg-red-100 text-red-700'};
            return colors[team] || 'bg-slate-100 text-slate-700';
        };

        // UI Scroll State
        let isFiltersAutoCollapsed = false;

        const handleScroll = (el) => {
            const filtersWrapper = document.getElementById('filters-wrapper');
            const filterToggleIcon = document.getElementById('filter-toggle-icon');
            const activeSummary = document.getElementById('active-filters-summary');
            if (!filtersWrapper) return;
            
            if (el.scrollTop > 80 && !isFiltersAutoCollapsed) {
                isFiltersAutoCollapsed = true;
                filtersWrapper.classList.add('filters-collapsed');
                if(filterToggleIcon) filterToggleIcon.style.transform = 'rotate(180deg)';
                if(activeSummary && activeSummary.innerHTML.trim() !== '') { 
                    activeSummary.classList.remove('hidden'); 
                    activeSummary.classList.add('flex'); 
                }
            } else if (el.scrollTop <= 20 && isFiltersAutoCollapsed) {
                isFiltersAutoCollapsed = false;
                filtersWrapper.classList.remove('filters-collapsed');
                if(filterToggleIcon) filterToggleIcon.style.transform = 'rotate(0deg)';
                if(activeSummary) { 
                    activeSummary.classList.add('hidden'); 
                    activeSummary.classList.remove('flex'); 
                }
            }
        };

        const toggleFiltersManual = (e) => {
            if (e) e.stopPropagation();
            const wrapper = document.getElementById('filters-wrapper');
            const icon = document.getElementById('filter-toggle-icon');
            const activeSummary = document.getElementById('active-filters-summary');
            if(wrapper) {
                const isCol = wrapper.classList.contains('filters-collapsed');
                isFiltersAutoCollapsed = !isCol; 
                wrapper.classList.toggle('filters-collapsed', !isCol);
                if(icon) icon.style.transform = !isCol ? 'rotate(180deg)' : 'rotate(0deg)';
                if(activeSummary && activeSummary.innerHTML.trim() !== '') {
                    if (!isCol) { 
                        activeSummary.classList.remove('hidden'); 
                        activeSummary.classList.add('flex'); 
                    } else { 
                        activeSummary.classList.add('hidden'); 
                        activeSummary.classList.remove('flex'); 
                    }
                }
            }
        };

        const getPreviewContent = (em) => {
            if (!em['Template HTML']) return `<div class="flex items-center justify-center h-full text-slate-400 text-sm w-full bg-white">No HTML available for this template</div>`;
            const html = escapeHTML(em['Template HTML']);
            if (state.previewDevice === 'mobile') {
                return `<div class="w-full h-full flex items-center justify-center bg-slate-100 overflow-y-auto py-8">
                    <div class="w-[375px] h-[812px] bg-white border-[8px] border-slate-800 rounded-[3rem] shadow-2xl relative overflow-hidden shrink-0">
                        <div class="absolute top-0 inset-x-0 h-6 bg-slate-800 rounded-b-3xl w-40 mx-auto z-10"></div>
                        <iframe class="w-full h-full border-none pt-6 bg-white" srcdoc="${html}"></iframe>
                    </div>
                </div>`;
            }
            return `<div class="w-full h-full bg-slate-100 p-6 overflow-y-auto">
                <div class="max-w-4xl mx-auto h-full bg-white shadow-md border border-slate-200 rounded">
                    <iframe class="w-full h-full border-none" srcdoc="${html}"></iframe>
                </div>
            </div>`;
        };

        const getFilteredData = () => {
            const lowerSearch = state.searchQuery.toLowerCase();
            return state.data.filter(item => {
                const name = (item['Email Name'] || '').toLowerCase();
                const subject = (item['Email Subject (En)'] || '').toLowerCase();
                const team = (item['Owner Team'] || '').toLowerCase();
                const matchesSearch = name.includes(lowerSearch) || subject.includes(lowerSearch) || team.includes(lowerSearch);
                const matchesTeam = state.selectedTeam === 'All' || item['Owner Team'] === state.selectedTeam;
                
                const matchesSystem = !state.filters.system || (item['System / Tool'] || 'Unknown').trim() === state.filters.system;
                const matchesTrigger = !state.filters.trigger || (item['Trigger Type'] || 'Unknown').trim() === state.filters.trigger;
                const matchesSender = !state.filters.sender || (item['From'] || 'Unknown').trim() === state.filters.sender; // <-- FIX: Changed from 'Sender Email' to 'From'
                const matchesEmailType = !state.filters.emailType || (item['Email Type'] || 'Unknown').trim() === state.filters.emailType;
                const matchesCategory = !state.filters.category || (item['Category'] || 'Unknown').trim() === state.filters.category;
                const matchesSendMethod = !state.filters.sendMethod || (item['Send Method'] || 'Unknown').trim() === state.filters.sendMethod;

                return matchesSearch && matchesTeam && matchesSystem && matchesTrigger && matchesSender && matchesEmailType && matchesCategory && matchesSendMethod;
            });
        };

        const getGroupedData = (filtered) => {
            const groupsMap = new Map();
            filtered.forEach(item => {
                const stage = item['Lifecycle Stage'] || 'Uncategorized';
                const subStage = item['Lifecycle Sub Stage'] || '';
                const subSubStage = item['Lifecycle Sub Sub Stage'] || '';
                
                if (!groupsMap.has(stage)) groupsMap.set(stage, new Map());
                const subMap = groupsMap.get(stage);
                
                if (!subMap.has(subStage)) subMap.set(subStage, new Map());
                const subSubMap = subMap.get(subStage);
                
                if (!subSubMap.has(subSubStage)) subSubMap.set(subSubStage, []);
                subSubMap.get(subSubStage).push(item);
            });
            
            return Array.from(groupsMap.entries()).map(([stage, subMap]) => [
                stage,
                Array.from(subMap.entries()).map(([subStage, subSubMap]) => [
                    subStage,
                    Array.from(subSubMap.entries())
                ])
            ]);
        };

        const renderSidebar = () => {
            const container = document.getElementById('team-filters');
            
            // Count templates per team
            const teamCounts = state.data.reduce((acc, item) => {
                const team = item['Owner Team'];
                if (team) acc[team] = (acc[team] || 0) + 1;
                return acc;
            }, {});

            // Sort teams descending by count
            const sortedTeams = Object.entries(teamCounts)
                .sort((a, b) => b[1] - a[1])
                .map(t => t[0]);
                
            const teams = ['All', ...sortedTeams];

            container.innerHTML = teams.map(team => {
                const count = team === 'All' ? state.data.length : teamCounts[team];
                const isActive = state.selectedTeam === team;
                const btnClass = isActive ? 'bg-slate-100 text-black font-semibold' : 'text-slate-600 hover:bg-slate-50 font-medium';
                return `<button data-team="${esc(team)}" class="w-full flex items-center justify-between px-3 py-2 rounded-md text-sm transition-colors ${btnClass}">
                    <div class="flex items-center gap-2 truncate">
                        <i data-lucide="${team === 'All' ? 'activity' : 'users'}" class="w-4 h-4 ${isActive ? 'text-black' : 'text-slate-400'}"></i>
                        <span class="truncate">${esc(team)}</span>
                    </div>
                    <span class="text-[10px] px-1.5 py-0.5 rounded-full ${isActive ? 'bg-black text-white' : 'bg-slate-200 text-slate-600'}">${count}</span>
                </button>`;
            }).join('');
            safeCreateIcons();
        };

        const createBarChart = (title, icon, dataMap, colorClass) => {
            const sorted = Object.entries(dataMap).sort((a,b) => b[1] - a[1]);
            const max = sorted.length ? sorted[0][1] : 1;
            const bars = sorted.map(([k,v]) => {
                const pct = Math.max((v / max) * 100, 2); // Minimum 2% width so small numbers are visible
                return `
                    <div class="group cursor-default">
                        <div class="flex justify-between text-[11px] mb-1.5">
                            <span class="font-bold text-slate-600 group-hover:text-black transition-colors truncate pr-2" title="${esc(k)}">${esc(k)}</span>
                            <span class="text-slate-400 font-bold group-hover:text-slate-600">${v}</span>
                        </div>
                        <div class="w-full bg-slate-100 rounded-full h-1.5 overflow-hidden">
                            <div class="${colorClass} h-full rounded-full transition-all duration-500" style="width: ${pct}%"></div>
                        </div>
                    </div>
                `;
            }).join('');
            return `<div class="bg-white p-5 rounded-xl border border-slate-200 shadow-sm hover:shadow-md transition-shadow flex flex-col h-full">
                <h3 class="font-bold text-slate-800 text-sm mb-4 flex items-center gap-2 shrink-0"><i data-lucide="${icon}" class="w-4 h-4 text-slate-400"></i> ${title}</h3>
                <div class="overflow-y-auto pr-2 flex-1 space-y-4 max-h-[280px]">${bars || '<div class="text-xs text-slate-400 font-medium">No data available</div>'}</div>
            </div>`;
        };

        const createDonutChart = (title, icon, dataMap) => {
            const sorted = Object.entries(dataMap).sort((a,b) => b[1] - a[1]);
            const total = sorted.reduce((sum, [_, v]) => sum + v, 0);
            
            // Fallback for empty data
            if (total === 0) return createBarChart(title, icon, dataMap, 'bg-slate-500'); 

            const colors = ['#0ea5e9', '#f59e0b', '#10b981', '#f43f5e', '#8b5cf6', '#06b6d4', '#eab308'];
            let currentOffset = 0;

            const slices = sorted.map(([k, v], i) => {
                const pct = (v / total) * 100;
                const strokeDasharray = `${pct} ${100 - pct}`;
                const strokeDashoffset = -currentOffset;
                currentOffset += pct;
                const color = colors[i % colors.length];

                return `<circle cx="21" cy="21" r="15.91549430918954" fill="transparent" 
                                stroke="${color}" stroke-width="6" 
                                stroke-dasharray="${strokeDasharray}" stroke-dashoffset="${strokeDashoffset}" 
                                class="transition-all duration-1000 ease-out"></circle>`;
            }).join('');

            const legend = sorted.map(([k, v], i) => {
                const color = colors[i % colors.length];
                const pct = Math.round((v / total) * 100);
                return `<div class="flex items-center justify-between text-[11px] mb-1.5 last:mb-0 group">
                            <div class="flex items-center gap-2 truncate pr-2">
                                <div class="w-2.5 h-2.5 rounded-sm shrink-0" style="background-color: ${color}"></div>
                                <span class="font-medium text-slate-600 group-hover:text-black transition-colors truncate" title="${esc(k)}">${esc(k)}</span>
                            </div>
                            <div class="flex items-center gap-2 shrink-0">
                                <span class="text-slate-400 font-bold group-hover:text-slate-600 transition-colors">${v}</span>
                                <span class="text-slate-400 text-[9px] w-6 text-right">${pct}%</span>
                            </div>
                        </div>`;
            }).join('');

            return `<div class="bg-white p-5 rounded-xl border border-slate-200 shadow-sm hover:shadow-md transition-shadow flex flex-col h-full min-h-[260px]">
                <h3 class="font-bold text-slate-800 text-sm mb-5 flex items-center gap-2 shrink-0"><i data-lucide="${icon}" class="w-4 h-4 text-slate-400"></i> ${title}</h3>
                <div class="flex-1 flex flex-col items-center justify-center gap-5">
                    <div class="relative w-32 h-32 shrink-0">
                        <svg class="w-full h-full transform -rotate-90 drop-shadow-sm" viewBox="0 0 42 42">
                            <circle cx="21" cy="21" r="15.91549430918954" fill="transparent" stroke="#f1f5f9" stroke-width="6"></circle>
                            ${slices}
                        </svg>
                        <div class="absolute inset-0 flex flex-col items-center justify-center pointer-events-none">
                            <span class="text-2xl font-black text-slate-800 leading-none">${total}</span>
                            <span class="text-[9px] text-slate-400 font-bold uppercase tracking-wider mt-0.5">Total</span>
                        </div>
                    </div>
                    <div class="w-full overflow-y-auto max-h-[100px] pr-2">
                        ${legend}
                    </div>
                </div>
            </div>`;
        };

        const renderMainContent = () => {

            // --- DATA AGGREGATIONS (FOR FILTERS & DASHBOARD CHARTS) ---
            const filterConfigs = [

                { title: 'Categories', icon: 'folder', field: 'Category', key: 'category' }

            const stageCounts = {};

            const configCounts = filterConfigs.reduce((acc, cfg) => ({ ...acc, [cfg.key]: {} }), {});

            filtered.forEach(item => {
                const stage = (item['Lifecycle Stage'] || 'Uncategorized').trim() || 'Uncategorized';

                    const val = (item[cfg.field] || 'Unknown').trim() || 'Unknown';

            // --- FILTER BLOCKS UI (Always Visible at Top) ---

            // Generate active filter pills for the summary view
            const activeFilterPills = Object.entries(state.filters)

                    return `<span class="bg-blue-50 text-blue-600 border border-blue-200 px-1.5 py-0.5 rounded text-[9px] font-bold uppercase tracking-wider flex items-center gap-1 shrink-0" title="${esc(label)}: ${esc(v)}">
                        <span class="opacity-70">${esc(label)}:</span> <span class="truncate max-w-[100px]">${esc(v)}</span>

            const activeSummaryHTML = activeFilterPills ?

                const isStacked = cfg.key === 'sendMethod' || cfg.key === 'trigger';
                const extraClass = isStacked ? 'flex-1 min-h-[90px]' : 'h-full max-h-[220px]';

                blockHtmlMap[cfg.key] = `
                    <div class="bg-white rounded-xl p-3 border border-slate-200 flex flex-col hover:shadow-md transition-shadow relative shadow-sm ${extraClass}">
                        <div class="text-[10px] font-bold text-slate-400 uppercase tracking-wider mb-1 flex items-center justify-between shrink-0 sticky top-0 bg-white z-10 pb-1">
                            <div class="flex items-center gap-1.5"><i data-lucide="${cfg.icon}" class="w-3.5 h-3.5"></i> ${cfg.title}</div>
                            ${activeVal ? `<span class="bg-blue-100 text-blue-600 text-[8px] px-1.5 py-0.5 rounded border border-blue-200 uppercase font-black tracking-wide shadow-sm">Active</span>` : ''}
                        </div>
                        <div class="flex-1 overflow-y-auto pr-1">
                            ${itemsHTML}
                        </div>
                    </div>
                `;
            });

            const overviewHTML = `
                <div class="bg-slate-50/95 backdrop-blur-sm border-b border-slate-200 shrink-0 sticky top-0 z-40">
                    <div class="max-w-7xl mx-auto px-4 py-3 sm:px-5">
                        <div class="flex items-center justify-between group cursor-pointer" onclick="toggleFiltersManual(event)">
                            <div class="flex items-center gap-2 text-slate-500 group-hover:text-slate-800 transition-colors flex-1 min-w-0">
                                <h2 class="text-[11px] font-bold uppercase tracking-wider flex items-center gap-1.5 shrink-0"><i data-lucide="filter" class="w-3.5 h-3.5"></i> Interactive Filters</h2>
                                <i data-lucide="chevron-up" id="filter-toggle-icon" class="w-4 h-4 transition-transform duration-300 shrink-0"></i>
                                ${activeSummaryHTML}
                            </div>
                            <div onclick="event.stopPropagation()" class="shrink-0 pl-2">${clearHTML}</div>
                        </div>
                        <div id="filters-wrapper" class="overflow-hidden transition-all duration-300 opacity-100 max-h-[1000px]">
                            <div class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-4 xl:grid-cols-6 gap-3 items-start pt-3 pb-2 h-full">
                                <div class="bg-[#feee00] rounded-xl p-3 border border-yellow-400 flex flex-col justify-center items-center text-black hover:shadow-md transition-shadow shadow-sm h-full max-h-[220px] min-h-[120px]">
                                    <i data-lucide="mail" class="w-6 h-6 mb-1 opacity-80"></i>
                                    <div class="text-3xl font-black leading-none mb-0.5">${filtered.length}</div>
                                    <div class="text-[9px] font-bold uppercase tracking-wider opacity-80 text-center leading-tight">Filtered<br>Templates</div>
                                </div>
                                <div class="flex flex-col gap-3 h-full max-h-[220px]">
                                    ${blockHtmlMap['sendMethod']}
                                    ${blockHtmlMap['trigger']}
                                </div>
                                ${blockHtmlMap['system']}
                                ${blockHtmlMap['sender']}
                                ${blockHtmlMap['emailType']}
                                ${blockHtmlMap['category']}
                            </div>
                        </div>
                    </div>
                </div>
            `;

            let bottomContentHTML = '';

            // --- VIEW SWITCHING LOGIC ---
            if (state.currentView === 'dashboard') {
                // RENDER DETAILED ANALYTICS DASHBOARD
                bottomContentHTML = `
                    <div class="max-w-7xl mx-auto p-4 sm:p-6 w-full flex-1">
                        <div class="mb-6 flex items-center gap-3">
                            <h2 class="text-xl font-black text-slate-800 tracking-tight">Detailed Analytics</h2>
                            <span class="text-[10px] font-bold uppercase tracking-wider bg-slate-200 text-slate-600 px-2 py-0.5 rounded-full shadow-sm">Based on current filters</span>
                        </div>
                        <div class="flex flex-col gap-6 pb-12">
                            <!-- Row 1: Send Method, Trigger Type, System/Tool -->
                            <div class="grid grid-cols-1 md:grid-cols-3 gap-4 sm:gap-6">
                                ${createDonutChart('Send Methods', 'send', configCounts.sendMethod)}
                                ${createDonutChart('Trigger Types', 'zap', configCounts.trigger)}
                                ${createDonutChart('Systems & Tools', 'server', configCounts.system)}
                            </div>
                            
                            <!-- Row 2: Lifecycle Stage, Email Type -->
                            <div class="grid grid-cols-1 md:grid-cols-2 gap-4 sm:gap-6">
                                ${createBarChart('Lifecycle Stages', 'git-commit', stageCounts, 'bg-blue-500')}
                                ${createBarChart('Email Types', 'tag', configCounts.emailType, 'bg-rose-500')}
                            </div>
                            
                            <!-- Row 3: Senders, Categories -->
                            <div class="grid grid-cols-1 md:grid-cols-2 gap-4 sm:gap-6">
                                ${createBarChart('Senders (From)', 'at-sign', configCounts.sender, 'bg-purple-500')}
                                ${createBarChart('Categories', 'folder', configCounts.category, 'bg-cyan-500')}
                            </div>
                        </div>
                    </div>
                `;
            } else {
                // RENDER JOURNEY MAP CARDS
                const createEmailRowHTML = (item) => {
                    const isSelected = state.selectedEmail && state.selectedEmail['S No'] === item['S No'];
                    const isExpanded = !!state.expandedCards[item['S No']];

                                <div class="flex items-start gap-2"><i data-lucide="user-check" class="w-3.5 h-3.5 text-slate-400 shrink-0 mt-0.5"></i><span class="line-clamp-1"><span class="font-semibold text-slate-700">From:</span> ${esc(item['From'] || 'no-reply@noon.com')}</span></div>

                                <div class="flex items-start gap-2"><i data-lucide="tag" class="w-3.5 h-3.5 text-slate-400 shrink-0 mt-0.5"></i><span class="line-clamp-1"><span class="font-semibold text-slate-700">Type:</span> ${esc(item['Email Type'] || 'N/A')}</span></div>

                                <div class="flex items-start gap-2"><i data-lucide="send" class="w-3.5 h-3.5 text-slate-400 shrink-0 mt-0.5"></i><span class="line-clamp-1"><span class="font-semibold text-slate-700">Method:</span> ${esc(item['Send Method'] || 'N/A')}</span></div>
                            </div>
                        </div>
                    </div>`;
                };

                    getGroupedData(filtered).map(([stage, subStagesArray], index) => {
                        const stageId = safeId(stage);
                        const isStageExpanded = !!state.expandedSections[stageId];
                        let subStageHTML = '';
                        for (const [subStage, subSubStagesArray] of subStagesArray) {
                            const subStageId = safeId(stage + '|' + subStage);
                            const isSubStageExpanded = !!state.expandedSections[subStageId];

                            for (const [subSubStage, items] of subSubStagesArray) {
                                const subSubStageId = safeId(stage + '|' + subStage + '|' + subSubStage);
                                const isSubSubStageExpanded = !!state.expandedSections[subSubStageId];

                            const subHeader = subStage ? `<div class="flex items-center gap-2 mb-4 mt-8 cursor-pointer group border-b border-slate-300 pb-2" onclick="toggleSection('${subStageId}')">
                                <i data-lucide="chevron-right" id="sec-icon-right-${subStageId}" class="w-5 h-5 text-slate-400 ${!isSubStageExpanded ? '' : 'hidden'}"></i>
                                <i data-lucide="chevron-down" id="sec-icon-down-${subStageId}" class="w-5 h-5 text-slate-400 ${!isSubStageExpanded ? 'hidden' : ''}"></i>
                                <h3 class="font-bold text-slate-800 text-lg">${esc(subStage)}</h3>
                            </div>` : '';
                            subStageHTML += `<div class="mb-4 pl-4 sm:pl-0">${subHeader}
                                <div id="sec-content-${subStageId}" class="collapsible-content ${!isSubStageExpanded && subStage ? 'collapsed' : ''}">${subSubStageHTML}</div>
                            </div>`;
                        }
                        let totalStageItems = 0;
                        subStagesArray.forEach(sub => sub[1].forEach(subSub => totalStageItems += subSub[1].length));
                        return `<div class="relative pl-12 sm:pl-16 mb-16 last:mb-8" style="animation: slideUp 0.5s ease-out forwards; animation-delay: ${index * 50}ms; opacity: 0; transform: translateY(20px);">
                            <div class="absolute left-4 sm:left-8 top-1 w-6 sm:w-8 h-6 sm:h-8 rounded-full bg-[#feee00] border-4 border-slate-50 shadow-sm flex items-center justify-center z-10"><div class="w-2 h-2 bg-black rounded-full"></div></div>
                            <div class="flex items-center gap-2 mb-2 cursor-pointer group" onclick="toggleSection('${stageId}')">
                                <i data-lucide="chevron-right" id="sec-icon-right-${stageId}" class="w-5 sm:w-6 h-5 sm:h-6 text-slate-400 ${!isStageExpanded ? '' : 'hidden'}"></i>
                                <i data-lucide="chevron-down" id="sec-icon-down-${stageId}" class="w-5 sm:w-6 h-5 sm:h-6 text-slate-400 ${!isStageExpanded ? 'hidden' : ''}"></i>
                                <h2 class="font-bold text-slate-800 text-xl sm:text-2xl uppercase tracking-wider">${esc(stage)}</h2>
                                <span class="bg-slate-200 text-slate-600 text-[10px] px-2 py-0.5 rounded-full font-bold">${totalStageItems} templates</span>
                            </div>
                            <div id="sec-content-${stageId}" class="collapsible-content ${!isStageExpanded ? 'collapsed' : ''}">${subStageHTML}</div>
                        </div>`;
                    }).join('')
                }</div>`;
            }

            container.innerHTML = `<div class="flex-1 overflow-y-auto bg-slate-50 relative flex flex-col" onscroll="handleScroll(this)">
                ${overviewHTML}
                ${bottomContentHTML}
            </div>`;
            
            // Sync filter toggle state after render
            const filterIcon = document.getElementById('filter-toggle-icon');
            const wrapper = document.getElementById('filters-wrapper');
            const activeSummary = document.getElementById('active-filters-summary');
            if (isFiltersAutoCollapsed && wrapper) {
                wrapper.classList.add('filters-collapsed');
                if (filterIcon) filterIcon.style.transform = 'rotate(180deg)';
                if (activeSummary && activeSummary.innerHTML.trim() !== '') {
                    activeSummary.classList.remove('hidden');
                    activeSummary.classList.add('flex');
                }
            }
            
            safeCreateIcons();
        };

        const renderDetailPanel = () => {
            const panel = document.getElementById('detail-panel');
            const content = document.getElementById('detail-content');
            if (!state.selectedEmail) { panel.classList.remove('panel-visible'); panel.classList.add('panel-hidden'); return; }
            panel.classList.remove('panel-hidden'); panel.classList.add('panel-visible');
            const em = state.selectedEmail;
            const link = em['Template Link'] || em['templateLink'] || '';
            const sender = em['From'] || em['senderEmail'] || 'no-reply@noon.com';

            let tabContent = state.previewTab === 'visual' ? getPreviewContent(em) : `<div class="w-full h-full bg-[#1e1e1e] shadow-inner overflow-hidden flex flex-col"><div class="bg-[#2d2d2d] px-4 py-2 flex justify-between items-center border-b border-[#404040]"><span class="text-xs text-slate-300 font-mono">index.html</span><button id="copy-btn" onclick="handleCopyCode()" class="text-xs px-2 py-1 rounded text-slate-300 hover:text-white bg-slate-700">Copy Code</button></div><pre class="flex-1 p-4 overflow-auto text-xs font-mono text-green-400 leading-relaxed whitespace-pre-wrap">${escapeHTML(em['Template HTML'])}</pre></div>`;
            
            content.innerHTML = `<div class="bg-white border-b border-slate-200 px-6 py-5 shrink-0 z-10">
                <div class="flex justify-between items-start mb-6">
                    <div class="flex-1 min-w-0">
                        <h1 class="text-[22px] font-bold text-slate-900 leading-tight tracking-tight mb-2">${esc(em['Email Subject (En)'] || 'No Subject Defined')}</h1>
                        <div class="flex items-center gap-2">
                            <div class="bg-slate-100 text-slate-500 text-[10px] font-mono px-2 py-1 rounded uppercase tracking-wider shrink-0">${esc(em['Email Name'] || 'UNTITLED')}</div>
                            ${link ? `<a href="${esc(link)}" target="_blank" class="flex items-center gap-1.5 px-2.5 py-1 rounded bg-blue-50 text-blue-600 hover:bg-blue-100 transition-colors text-[10px] font-bold uppercase tracking-wider">
                                <i data-lucide="external-link" class="w-3 h-3"></i> Open Template
                            </a>` : ''}
                        </div>
                    </div>
                </div>
                <div class="flex items-start gap-3">
                    <div class="w-10 h-10 rounded-full bg-[#feee00] flex items-center justify-center font-bold text-black text-sm uppercase">${sender[0]}</div>
                    <div class="flex-1 min-w-0">
                        <div class="flex items-baseline justify-between gap-2 mb-0.5">
                            <div class="flex items-center gap-1.5 text-[14px]">
                                <span class="font-bold text-slate-900">From:</span>
                                <span class="text-slate-600">${esc(sender)}</span>
                            </div>
                        </div>
                        <div class="text-[13px] text-slate-500">to <span class="font-medium text-slate-700">${esc(em['Target Sellers'] || 'All Relevant Sellers')}</span></div>
                    </div>
                </div>
            </div>
            <div class="bg-slate-50/80 px-6 py-4 border-b border-slate-200 grid grid-cols-3 gap-6 shrink-0 shadow-inner">
                <div><label class="text-[10px] font-bold text-slate-400 uppercase tracking-widest block mb-1">System</label>
                    <div class="flex items-center gap-1.5 text-slate-700 font-semibold text-[13px]"><i data-lucide="settings" class="w-3.5 h-3.5 text-slate-300"></i> ${esc(em['System / Tool'] || 'N/A')}</div>
                </div>
                <div><label class="text-[10px] font-bold text-slate-400 uppercase tracking-widest block mb-1">Trigger Type</label>
                    <div class="flex items-center gap-1.5 text-slate-700 font-semibold text-[13px]"><i data-lucide="activity" class="w-3.5 h-3.5 text-slate-300"></i> ${esc(em['Trigger Type'] || 'N/A')}</div>
                </div>
                <div><label class="text-[10px] font-bold text-slate-400 uppercase tracking-widest block mb-1">Logic</label>
                    <div class="flex items-center gap-1.5 text-slate-700 italic text-[13px] truncate" title="${esc(em['Trigger Event'] || '')}"><i data-lucide="zap" class="w-3.5 h-3.5 text-amber-400"></i> ${esc(em['Trigger Event'] || em['Frequency'] || 'Manual')}</div>
                </div>
            </div>
            <div class="flex flex-col flex-1 overflow-hidden bg-slate-50">
                <div class="flex border-b border-slate-200 bg-white px-4 shrink-0 items-center">
                    <div class="flex gap-2">
                        <button onclick="setPreviewTab('visual')" class="px-4 py-3 text-sm font-semibold border-b-2 ${state.previewTab === 'visual' ? 'border-black text-black' : 'border-transparent text-slate-500'}">Visual Preview</button>
                        <button onclick="setPreviewTab('code')" class="px-4 py-3 text-sm font-semibold border-b-2 ${state.previewTab === 'code' ? 'border-black text-black' : 'border-transparent text-slate-500'}">Raw HTML</button>
                    </div>
                    <div class="flex items-center gap-2 ml-auto my-1.5">
                        <div class="flex bg-slate-100 p-1 rounded-lg border border-slate-200">
                            <button onclick="setPreviewDevice('desktop')" class="px-3 py-1 rounded text-xs ${state.previewDevice === 'desktop' ? 'bg-white shadow-sm font-semibold text-black' : 'text-slate-500'}">Desktop</button>
                            <button onclick="setPreviewDevice('mobile')" class="px-3 py-1 rounded text-xs ${state.previewDevice === 'mobile' ? 'bg-white shadow-sm font-semibold text-black' : 'text-slate-500'}">Mobile</button>
                        </div>
                    </div>
                </div>
                <div class="flex-1 overflow-hidden relative">${tabContent}</div>
            </div>`;
            safeCreateIcons();
        };

        const safeCreateIcons = () => { try { if (typeof lucide !== 'undefined') lucide.createIcons(); } catch (e) {} };

        const updateUI = () => {
            renderSidebar();
            renderMainContent();
            renderDetailPanel();
        };

        const setTeamFilter = (team) => { state.selectedTeam = team; updateUI(); };
        const setPreviewTab = (tab) => { state.previewTab = tab; renderDetailPanel(); };
        const setPreviewDevice = (device) => { state.previewDevice = device; renderDetailPanel(); };
        
        const toggleSection = (id) => { 
            state.expandedSections[id] = !state.expandedSections[id]; 
            const content = document.getElementById(`sec-content-${id}`);
            const iconRight = document.getElementById(`sec-icon-right-${id}`);
            const iconDown = document.getElementById(`sec-icon-down-${id}`);
            if (content) content.classList.toggle('collapsed', !state.expandedSections[id]);
            if (iconRight) iconRight.classList.toggle('hidden', state.expandedSections[id]);
            if (iconDown) iconDown.classList.toggle('hidden', !state.expandedSections[id]);
        };

        const toggleCardExpansion = (e, sNo) => { 
            if (e) e.stopPropagation(); 
            state.expandedCards[sNo] = !state.expandedCards[sNo]; 
            const content = document.getElementById(`card-content-${sNo}`);
            const iconUp = document.getElementById(`card-icon-up-${sNo}`);
            const iconDown = document.getElementById(`card-icon-down-${sNo}`);
            if (content) content.classList.toggle('collapsed', !state.expandedCards[sNo]);
            if (iconUp) iconUp.classList.toggle('hidden', !state.expandedCards[sNo]);
            if (iconDown) iconDown.classList.toggle('hidden', state.expandedCards[sNo]);
        };

        const selectEmail = (sNo) => { 
            state.selectedEmail = state.data.find(d => d['S No'] === sNo); 
            document.querySelectorAll('[id^="card-"]').forEach(el => el.classList.remove('bg-blue-50/50', 'border-l-blue-500'));
            document.getElementById(`card-${sNo}`)?.classList.add('bg-blue-50/50', 'border-l-blue-500');
            renderDetailPanel(); 
        };

        const closeDetailPanel = () => { state.selectedEmail = null; renderMainContent(); renderDetailPanel(); };
        const openModal = (id) => { document.getElementById(id).classList.remove('modal-hidden'); document.getElementById(id).classList.add('modal-visible'); };
        const closeModal = (id) => { document.getElementById(id).classList.remove('modal-visible'); document.getElementById(id).classList.add('modal-hidden'); };

        document.getElementById('search-input').addEventListener('input', (e) => { state.searchQuery = e.target.value; renderMainContent(); });
        document.querySelector('main').addEventListener('click', (e) => {
            const sel = e.target.closest('[data-select-sno]');
            if (sel) selectEmail(sel.dataset.selectSno);
        });

        document.getElementById('addTemplateForm').addEventListener('submit', (e) => {
            e.preventDefault();
            const fd = new FormData(e.target);
            state.data.unshift({
                "S No": Date.now().toString(),
                "Email Name": fd.get('emailName'),
                "Template Link": fd.get('templateLink'),
                "From": fd.get('senderEmail'),
                "Owner Team": fd.get('team'),
                "Lifecycle Stage": fd.get('lifecycleStage'),
                "Email Subject (En)": fd.get('subject'),
                "Primary Purpose": fd.get('purpose'),
                "Trigger Type": fd.get('triggerType'),
                "Trigger Event": fd.get('trigger'),
                "Email Type": fd.get('emailType'),
                "Category": fd.get('category'),
                "Send Method": fd.get('sendMethod'),
                "Template HTML": fd.get('html')
            });
            e.target.reset(); closeModal('addModal'); updateUI();
        });

        const handleFileUpload = (event) => {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = (e) => {
                try {
                    const workbook = XLSX.read(new Uint8Array(e.target.result), { type: 'array' });
                    const jsonData = XLSX.utils.sheet_to_json(workbook.Sheets[workbook.SheetNames[0]], { raw: false, defval: "" });
                    if (jsonData.length > 0) {
                        state.data = jsonData.map(row => {
                            const n = {};
                            for (let k in row) n[k.trim()] = row[k] ? row[k].toString().trim() : '';
                            return n;
                        });
                        state.selectedEmail = null; state.expandedCards = {}; state.expandedSections = {};
                        closeModal('importModal'); updateUI();
                    }
                } catch (err) { 
                    document.getElementById('importErrorMsg').textContent = "Failed to parse file."; 
                    document.getElementById('importErrorMsg').classList.remove('hidden'); 
                }
            };
            reader.readAsArrayBuffer(file);
        };

        // Added this missing function referenced in the HTML to copy code to clipboard without errors
        const handleCopyCode = () => {
            if (!state.selectedEmail || !state.selectedEmail['Template HTML']) return;
            document.execCommand('copy');
            const btn = document.getElementById('copy-btn');
            if (btn) {
                const originalText = btn.innerText;
                btn.innerText = 'Copied!';
                setTimeout(() => btn.innerText = originalText, 2000);
            }
        };
        
        // Listen to copy events for the dummy button execution
        document.addEventListener('copy', (e) => {
            if(state.selectedEmail && state.selectedEmail['Template HTML']) {
               e.clipboardData.setData('text/plain', state.selectedEmail['Template HTML']);
               e.preventDefault();
            }
        });

        updateUI();
    </script>
</body>
</html>
